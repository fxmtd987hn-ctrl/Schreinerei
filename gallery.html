<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Möbelgalerie</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header id="top">
      <p class="logo">Schreinerei Meier</p>
      <nav>
        <a href="index.html">Startseite</a>
        <a href="preise.html">Preise</a>
        <a href="holzarten.html">Holzarten</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>
    </header>

    <main>
      <h1>Möbelgalerie unserer Schreinerei</h1>
      <p>Eine Auswahl unserer Möbel aus Schweizer Holz.</p>

      <div class="galerie">
        <section>
          <h2>Tische</h2>
        <figure>
          <img src="./img/TischEiche.png" alt="Esstisch aus Eiche" title="Material: Eiche" width="250">
          <figcaption>Abbildung 1: Esstisch aus massiver Eiche</figcaption>
        </figure>
        </section>
        <section>
          <h2>Stühle</h2>
        <figure>
          <img src="./img/Stuhl.png" alt="Stuhl aus Eiche" title="Material: Eiche" width="250">
          <figcaption>Abbildung 2: Passender Stuhl zum Esstisch</figcaption>
        </figure>
        </section>
        <section>
          <h2>Schränke</h2>
        <figure>
          <img src="./img/Schrank.png" alt="Kleiderschrank aus Buche" title="Material: Buche" width="250">
          <figcaption>Abbildung 3: Kleiderschrank aus Buche</figcaption>
        </figure>
        </section>
        <section id="regale">
          <h2>Regale</h2>
        <figure>
          <img src="./img/Regal.png" alt="Bücherregal aus Nussbaum" title="Material: Nussbaum" width="250">
          <figcaption>Abbildung 4: Bücherregal aus Nussbaum</figcaption>
        </figure>
        </section>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Schreinerei Meier</p>
    </footer>
  </body>
</html>
